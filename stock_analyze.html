function scoreHistory(){
 if(S.scoreHistory)return S.scoreHistory;
 const stocks=activeStocks(),marketDates=calcMarket().map(x=>x.d);
 if(!marketDates.length)return {dates:[],series:[]};

 const indices=[];for(let i=0;i<marketDates.length;i+=20)indices.push(i);

 // 最新の上位8銘柄を固定して推移を比較。各過去時点の順位付けには未来を使わない。
 const featured=rankings().filter(x=>valid(x.score)).slice(0,8),points=featured.map(()=>[]),dates=[];
 for(let i of indices){
  let d=marketDates[i],ranks=scoreAll(stocks.map(s=>makeMetrics(s,d)).filter(Boolean));
  let mp=new Map(ranks.map(x=>[x.id,x.score]));
  dates.push(d);featured.forEach((s,j)=>points[j].push(mp.get(s.id)??null));
 }
 S.scoreHistory={dates,series:featured.map((s,i)=>({name:s.name,values:points[i],color:colorFor(i)}))};return S.scoreHistory;
}

function drawCandle(id,rr){let cv=$('#'+id);if(!cv||!rr.length)return;let box=cv.parentElement,w=cv.clientWidth||box.clientWidth,h=cv.clientHeight||340,dpr=Math.min(devicePixelRatio||1,2);cv.width=w*dpr;cv.height=h*dpr;let ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const L=55,T=25,B=32,R=15,Pw=w-L-R,Ph=h-T-B;let xvals=rr.flatMap(r=>[r.hi,r.lo,r.p,r.op].filter(valid));let lo=Math.min(...xvals),hi=Math.max(...xvals),pad=Math.max(.01,(hi-lo)*.09);lo-=pad;hi+=pad;let y=v=>T+(hi-v)/(hi-lo)*Ph;ctx.font='11px system-ui';for(let i=0;i<=4;i++){let v=lo+(hi-lo)*i/4,yy=y(v);ctx.fillStyle='#9cacc2';ctx.textAlign='right';ctx.fillText(num(v),L-8,yy+4);ctx.strokeStyle='#294057';ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(w-R,yy);ctx.stroke()}let step=Pw/rr.length,bw=Math.max(1,Math.min(12,step*.64));rr.forEach((r,i)=>{let high=valid(r.hi)?r.hi:r.p,low=valid(r.lo)?r.lo:r.p,open=valid(r.op)?r.op:r.p,c=r.p,x=L+(i+.5)*step;ctx.strokeStyle=ctx.fillStyle=c>=open?'#63dabb':'#ff899c';ctx.beginPath();ctx.moveTo(x,y(high));ctx.lineTo(x,y(low));ctx.stroke();ctx.fillRect(x-bw/2,Math.min(y(open),y(c)),bw,Math.max(1,Math.abs(y(c)-y(open))))});ctx.fillStyle='#d8e8f5';ctx.textAlign='center';for(let i=0;i<6;i++){let k=Math.min(rr.length-1,Math.round(i*(rr.length-1)/5));ctx.fillText(rr[k].d.slice(5).replace('-','/'),L+(k+.5)*step,h-9)}let tip=box.querySelector('.plot-tip');cv.onmousemove=e=>{let k=clamp(Math.floor((e.clientX-cv.getBoundingClientRect().left-L)/step),0,rr.length-1),r=rr[k];tip.textContent=`${r.d}\n調整始値: ${num(r.op)}\n高値: ${num(r.hi)}\n安値: ${num(r.lo)}\n調整終値: ${num(r.p)}`;tip.style.display='block';tip.style.left=Math.max(4,Math.min(w-175,e.clientX-cv.getBoundingClientRect().left+12))+'px';tip.style.top='35px'};cv.onmouseleave=()=>tip.style.display='none'}

function eventMatches(r,kind,threshold,volFactor){switch(kind){case'drop':return valid(r.ret)&&r.ret<=-threshold/100;case'rise':return valid(r.ret)&&r.ret>=threshold/100;case'volume':return valid(r.v)&&valid(r.avgVol20)&&r.avgVol20>0&&r.v/r.avgVol20>=volFactor;case'gapdown':return valid(r.gap)&&r.gap<=-threshold/100;case'gapup':return valid(r.gap)&&r.gap>=threshold/100;case'rsi':return valid(r.rsi)&&r.rsi<=threshold;case'newhigh':return valid(r.prevHigh60)&&r.p>r.prevHigh60;case'newlow':return valid(r.prevLow60)&&r.p<r.prevLow60;case'breakma':{if(!r.index)return false;let s=S.stocks.find(x=>x.rows[r.index]===r);let old=s?.rows[r.index-1];return old&&valid(old.ma20)&&valid(r.ma20)&&old.p<=old.ma20&&r.p>r.ma20}default:return false}}

function pageMethods(){return {html:`<h2 class="section-title">指標の定義・計算上の約束</h2>`+

document.addEventListener('click',ev=>{let t=ev.target.closest('button');if(!t)return;if(t.dataset.nav){S.page=t.dataset.nav;render();return}if(t.dataset.page){S.page=t.dataset.page;render();return}
 switch(t.id){case'applyPeriod':{let a=$('#startDate').value,b=$('#endDate').value;if(!a||!b||a>b){alert('開始日・終了日を確認してください。');return}S.start=a;S.end=b;S.userSetPeriod=true;invalidate();render();break}
 case'chooseFiles':$('#files')?.click();break;case'sampleData':addStock(packFile('提示サンプル_2018年1月.csv',demo));S.uploadMessages.push('✓ 提示サンプル：2018/1/4～1/31、19日分');render();break;
 case'allOn':S.stocks.forEach(s=>S.selected.add(s.id));invalidate();render();break;case'allOff':S.selected.clear();invalidate();render();break;
 case'exportJson':exportJSON();break;case'exportRanking':exportRanking();break;case'exportMarket':marketCSV();break;case'exportEvents':exportEvents();break;
 case'rescore':{S.weights=$$('[data-weight]').map(x=>clamp(+x.value,0,100));if(sum(S.weights)<=0){alert('少なくとも一つの重みを1以上にしてください。');return}S.profile='custom';S.ranking=null;S.scoreHistory=null;persist();render();break}
 case'applyEvent':S.event={kind:$('#eventKind').value,threshold:clamp(+( $('#eventThreshold').value||0),0,100),volume:clamp(+($('#eventVolume').value||1),1,100),cooldown:clamp(Math.trunc(+$('#eventCooldown').value||0),0,250),universe:$('#eventUniverse').value};S.focus=$('#eventFocus').value;render();break;
 }
 if(t.dataset.remove){let id=t.dataset.remove;if(!confirm('この銘柄を分析対象から削除しますか？'))return;S.stocks=S.stocks.filter(x=>x.id!==id);S.selected.delete(id);if(S.focus===id)S.focus=S.stocks[0]?.id||null;invalidate();if(S.stocks.length)syncPeriod();else{S.start='';S.end=''}render()}
});
document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='files'){loadFiles([...t.files]);t.value=''}if(t.dataset.select){if(t.checked)S.selected.add(t.dataset.select);else S.selected.delete(t.dataset.select);invalidate();render()}if(t.dataset.rename){let s=S.stocks.find(x=>x.id===t.dataset.rename);if(s){s.name=t.value.trim()||s.filename;invalidate();render()}}
 if(t.id==='profile'){S.profile=t.value;S.weights=[...profiles[S.profile]];S.ranking=null;S.scoreHistory=null;persist();render()}if(t.id==='scoreMode'){S.scoreMode=t.value;S.ranking=null;S.scoreHistory=null;persist();render()}if(t.id==='rankSort'){S.sort=t.value;render()}if(t.id==='stockFocus'||t.id==='eventFocus'){S.focus=t.value;if(t.id==='stockFocus')render()}
 if(t.id==='priceMode'){S.chartMode=t.value;render()}if(t.id==='seasonTarget'){S.seasonTarget=t.value;render()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='searchStock'){S.filterSearch=ev.target.value;$('#stockSelect').innerHTML=stockChips()}});
function bindDrop(){const root=$('#view');root.addEventListener('dragover',e=>{const area=e.target.closest('#drop');if(area){e.preventDefault();area.classList.add('dragover')}});root.addEventListener('dragleave',e=>{let area=e.target.closest('#drop');if(area)area.classList.remove('dragover')});root.addEventListener('drop',e=>{const area=e.target.closest('#drop');if(area){e.preventDefault();area.classList.remove('dragover');loadFiles([...e.dataTransfer.files].filter(x=>/\.(csv|tsv|txt)$/i.test(x.name)))}})}
window.addEventListener('resize',()=>{clearTimeout(window.__stockResize);window.__stockResize=setTimeout(render,180)});
bindDrop();render();
})();
</script>
</body>
</html>
