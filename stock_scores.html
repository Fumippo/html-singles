function parseStock(filename,text){let data=fileCSV(text);if(data.length<2)throw Error('有効なヘッダーとデータ行がありません');let heads=data.shift().map(v=>String(v).trim().replace(/^\ufeff/,'').replace(/\s+/g,'').toLowerCase());let col=(...a)=>heads.findIndex(v=>a.includes(v));let dc=col('date','日付','年月日','datetime','time'),cc=col('close','終値'),ac=col('adjusted_close','adjclose','adj_close','adjustedclose','調整後終値','修正終値'),vc=col('volume','出来高','売買高');if(dc<0||cc<0)throw Error('date と close が必要です');let bad=0,duplicates=0,adjCount=0,raw=[];for(let rec of data){if(!rec.length||rec.every(x=>!String(x).trim()))continue;let d=normDate(rec[dc]),c=parseN(rec[cc]);if(!d||!V(c)||c<=0){bad++;continue}let a=ac>=0?parseN(rec[ac]):null;if(!V(a)||a<=0)a=c;let vol=vc>=0?parseN(rec[vc]):null;raw.push({d,c,p:a,v:vol});if(Math.abs(c/a-1)>1e-7)adjCount++}raw.sort((a,b)=>a.d.localeCompare(b.d));let rows=[];for(let r of raw){if(rows.length&&rows.at(-1).d===r.d){rows[rows.length-1]=r;duplicates++}else rows.push(r)}if(rows.length<2)throw Error('有効なデータが2行以上必要です');

function getMetricSeries(stock,begin,end){let startIdx=stock.rows.findIndex(r=>r.d>=begin);if(startIdx<0)return new Map();let first=null,high=-Infinity,maxDD=0,ddPeak=null,ddTrough=null,peakDate='',troughDate='',dailyN=0,dailyS=0,dailySQ=0,ddWorstLen=0,underLen=0;

function viewHelp(){return {html:`<h2>スコア計算式・運用上の注意・使用方法</h2>`+
 panel('旧スタジオの5要素を維持',`<p>① <b>収益力</b>：期間騰落率、シャープレシオ（相対の場合）。絶対評価は年率換算収益率とシャープレシオをtanh変換。<br>② <b>リスク耐性</b>：年率ボラティリティ（低いほど高得点）と最大ドローダウン（浅いほど高得点）。<br>③ <b>トレンド</b>：期間内の各日の20・60・200日線上回り平均、20日前・60日前比のモメンタム。<br>④ <b>回復力</b>：最大DDの底から最大DD直前の高値への戻り率と現在DD。<br>⑤ <b>流動性</b>：期間内の未調整終値×出来高の中央値、出来高ゼロ日の比率（相対採点）。</p><p>標準配点＝収益力30・リスク25・トレンド20・回復15・流動性10。5要素の有効な値だけで配点比率を再配分します。元プログラムと同じ基本式で算出し、<b>5営業日未満は採点しません</b>。20営業日未満は参考値です。</p>`)+
 panel('相対・絶対スコアの違い',`<p><b>相対：</b>各基礎指標について、同じ日の採点対象銘柄内で百分位点を計算。高い順・低い順を指標ごとに切り替えます。値が同点の場合は同じ百分位点です。比較対象銘柄が変わるとスコアも変わります。母集団は「データ管理」の評価チェックに固定します。</p><p><b>絶対：</b>旧スタジオと同じ独自のtanh変換などを使用。ただし業界標準に校正された点数ではありません。評価銘柄数が1件だけなら相対方式を指定しても絶対方式へ切替えます。2銘柄以上の母集団で一部の日に1銘柄しか有効でない場合は、その日のスコアを保留して途中の採点方式切替を防ぎます。</p>`)+
 panel('累積スコア履歴の作り方',`<p>評価開始日を設定すると、評価開始日から過去方向ではなく、<b>評価開始日→各評価日まで</b>の成績が毎日更新されます。たとえば2010/1/4を起点とすると、2015年のスコアは2010年〜2015年の実績を使い、2026年の株価は含みません。各営業日のスコアは全営業日分保存し、グラフが重い場合でも点を数値計算から間引きません。</p><p>20・60・200日移動平均などは元の採点方式の構成要素であり、表示の都合で勝手に追加した移動平均ではありません。移動平均にはCSV内の評価開始日前の過去価格を使用できます。期間内の収益率・ドローダウンは評価開始日からの値で計算します。</p><p>週・月・年末の表示は「各期間の末日にすでに算出したスコア」を選ぶだけで、平均スコアを計算する機能ではありません。</p>`)+
 panel('操作例：色が分からない問題を解決',`<p>最初に「CSV・銘柄管理」で株価ファイルを複数選択します。表示名から自動的に日付が消えます。カラーピッカーで銘柄別に色を固定できます。</p><p>上段の「表示銘柄を選択」では、スコア算出に使う母集団を変えず、<b>描画対象だけ</b>を変更できます。グラフの凡例は全銘柄表示でき、クリックすると特定銘柄を強調します。横棒グラフでは名前を左側、棒を右側に表示するため、20銘柄以上でも判別しやすくなります。</p><p>折れ線グラフをドラッグすると表示範囲が拡大します。クリックすると比較日B、Shift+クリックで比較日Aを移動します。ドラッグで変わるのは表示範囲だけで、採点起点は変化しません。</p>`)+
 panel('配点感度と将来検証の位置づけ',`<p>配点シミュレーションは、現在の日の要素点にさまざまな非負の配点を与え、順位がどれくらい変わるかを検証します。「配点に頑健」＝「将来上がる」という意味ではありません。配点を変更して全期間のスコアを改めて算出したい場合は「この配点で全営業日を再採点」を押します。</p><p>将来検証では各月末に確定していたスコアで銘柄を選び、5〜250営業日後の騰落率を別途観測します。<b>未来データの採点混入は行いません</b>。ただし現在読み込まれた銘柄集合には、生存銘柄バイアスがあります。結果を見て基準を変えると過剰適合になります。</p>`)+
 panel('CSV・計算・品質の注意',`<p>株価騰落率は <code>adjusted_close</code> を優先し、欠損時に <code>close</code> へフォールバックします。売買代金の概算は <code>close × volume</code> です。配当再投資の再現や分割前の売買単位の完全補正は元CSV依存です。<b>このスコア研究ラボに初期資金の売買シミュレーションはありません。</b></p><p>不完全な観測日は、銘柄ごとの前回の有効スコアを指定営業日数まで持ち越す設定ができます。欠測5日を超えた銘柄は日別ランキングから除外します。これは上場廃止銘柄を補完するものではありません。</p><p>日次のスコア計算は銘柄ごとに過去から順次更新し、売買代金の中央値はストリーミング中央値で計算します。全日再計算はブラウザ負荷を考慮して途中で画面更新を許す方式です。銘柄数・期間が大きいと計算時間が増えます。</p>`)+
 panel('バージョン2.0の実装範囲',`<p>実装済み：表示名と固定色／全日スコア・順位／任意銘柄表示／グラフドラッグ／A・B時点比較／5要素分解／ランキング滞在期間／スコア安定性・分布／相関／配点5プロファイル比較／1,000〜10,000通り配点試験／毎月末の将来実績検証／CSV・PNG出力／設定の保存・復元。</p><p>未実装：リアルタイム株価取得、自動売買、証券口座連携、業種マスタの自動取得、機械学習による将来保証。</p>`)};}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab===S.tab));$('#fromDate').value=S.start;$('#toDate').value=S.end;$('#scoreMode').value=S.mode;$('#profile').value=S.profile;$('#stale').value=String(S.stale);
 $('#globalBar').innerHTML=S.hist&&S.tab!=='data'&&S.tab!=='help'?sharedPicker():'';
 let target=$('#app'),res;if(!S.hist&&S.tab!=='data'&&S.tab!=='help'){target.innerHTML='<div class="empty"><h2>データを読込んでください</h2>「CSV・銘柄管理」から複数の株価CSVを読み込むと、全期間のスコア・順位・5要素を計算できます。<div style="margin-top:14px"><button data-tab="data" class="main">CSVを読み込む →</button></div></div>';return}
 try{switch(S.tab){case'overview':res=viewOverview();break;case'timeline':res=viewTimeline();break;case'rank':res=viewRank();break;case'decomp':res=viewDecomp();break;case'compare':res=viewCompare();break;case'stats':res=viewStats();break;case'weights':res=viewWeights();break;case'forward':res=viewForward();break;case'data':res=viewData();break;case'help':res=viewHelp();break;default:res=viewOverview()}
 target.innerHTML=res.html;res.draw?.()}catch(e){console.error(e);target.innerHTML=`<div class="note alert">画面の描画に失敗しました：${esc(e.message)}</div>`}}
function invalidateAndCompute(baseToo=false){if(baseToo)S.base=null;S.hist=null;S.weightCache=null;S.forwardCache=null;compute()}
function importStocks(rows){let any=false,wasEmpty=!S.stocks.length;for(let st of rows){let old=S.stocks.findIndex(s=>s.filename===st.filename);if(old>=0)S.stocks[old]=st;else S.stocks.push(st);S.active.add(st.id);if(!S.focus)S.focus=st.id;any=true}
 if(any){let sorted=S.stocks.flatMap(s=>[s.start,s.end]).sort();if(!S.customDates||wasEmpty){S.start=sorted[0];S.end=sorted.at(-1)}if(!S.snapA)S.snapA=S.start;if(!S.snapB)S.snapB=S.end;S.plotStart=null;S.plotEnd=null;invalidateAndCompute(true)}else render()}
async function readFiles(files){if(!files.length)return;status('CSVの読み込み・解析中',2);await yieldUI();let parsed=[];for(let f of files){try{let ab=await f.arrayBuffer(),content=new TextDecoder('utf-8').decode(ab);if(content.includes('�')){content=new TextDecoder('shift_jis').decode(ab)}let obj=parseStock(f.name,content);parsed.push(obj);S.filesMessages.push(`✓ ${f.name}：${fmt(obj.rows.length,0)}行。不正${obj.quality.bad} / 重複${obj.quality.duplicates}`)}catch(e){S.filesMessages.push(`✕ ${f.name}：${e.message}`)}await yieldUI()}clearStatus();if(parsed.length)importStocks(parsed);else render()}
function sampleStocks(){let all=[],labels=['1111_デモ上昇','2222_デモ横ばい','3333_デモ急騰','4444_デモ低変動','5555_デモ景気敏感','6666_デモ高変動'];let n=650,starting=new Date(Date.UTC(2021,0,4)),dates=[],date=new Date(starting);while(dates.length<n){let dow=date.getUTCDay();if(dow!==0&&dow!==6)dates.push(date.toISOString().slice(0,10));date.setUTCDate(date.getUTCDate()+1)}let seed=1234567,rng=()=>{seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296};for(let j=0;j<labels.length;j++){let p=500+220*j,lines=['date,close,volume,adjusted_close'];for(let i=0;i<n;i++){let r=rng()-.5,boost=j===0?.0008:j===1?0:j===2?.0015:j===3?.0002:j===4?.0005:-.0001,vol=j===3?.006:j===5?.05:.025;p=Math.max(30,p*(1+boost+vol*r*2));let v=100000+Math.floor(rng()*800000);lines.push(`${dates[i]},${p.toFixed(3)},${v},${p.toFixed(3)}`)}all.push(parseStock(labels[j]+'_2021-01-04_2023-06-30.csv',lines.join('\n')))}S.filesMessages.push('✓ 6銘柄・650営業日分の操作確認用合成データ（実在の市場株価ではありません）。');importStocks(all)}
function updateSnapshots(){let a=$('#snapA')?.value,b=$('#snapB')?.value;if(!a||!b)return;S.snapA=nearestDate(a);S.snapB=nearestDate(b);render()}
function exportDaily(){let H=S.hist;if(!H)return;let rows=[];for(let i=0;i<H.dates.length;i++)for(let z of H.daily[i])rows.push([H.dates[i],z.id,sName(byId(z.id)),z.rank,z.score,...z.parts,...z.contributions,z.coverage,z.metric.n,z.metric.lastDate,z.mode]);toCSV('スコア全営業日_'+S.start+'_'+S.end+'.csv',['日付','銘柄ID','表示名','順位','総合点',...K.map(x=>x+'点'),...K.map(x=>x+'寄与点'),'評価項目カバー率','累積評価観測数','最終株価観測日','実効採点方式'],rows)}
function exportWeights(){let z=S.weightCache?.data;if(!z){alert('先に大量配点試験を実行してください');return}toCSV('配点試験_'+S.snapB+'.csv',['銘柄','首位獲得回数','首位獲得率','TOP5率','平均順位','順位標準偏差','最高順位','最低順位'],z.map(x=>[sName(byId(x.id)),x.win,x.winRate,x.top5Rate,x.avgRank,x.sdRank,x.min,x.max]))}
function exportForward(){let d=S.forwardCache?.data;if(!d){alert('先に将来成績の検証を実行してください');return}toCSV('スコア将来検証_'+S.forwardHorizon+'日.csv',['選定日','将来評価日','銘柄数','上位群数','上位群騰落率','全銘柄騰落率','下位群騰落率','上位群の超過リターン','横断相関'],d.months.map(x=>[x.d,x.to,x.n,x.k,x.top,x.market,x.bottom,x.excess,x.corr]))}
function saveSettings(){let obj={app:'株価スコア研究ラボ',version:2,createdAt:new Date().toISOString(),start:S.start,end:S.end,mode:S.mode,profile:S.profile,weights:S.weights,stale:S.stale,names:S.names,colors:S.colors,
 evaluation:[...S.active],display:[...S.display],focus:S.focus,compareA:S.compareA,compareB:S.compareB,snapA:S.snapA,snapB:S.snapB,
 note:'株価のCSV本体は含みません。ファイルを読み直す必要があります。'};download(JSON.stringify(obj,null,2),'株価スコア研究ラボ_設定.json','application/json;charset=utf-8')}
async function readSettings(file){try{let obj=JSON.parse(await file.text());if(obj.version!==2)throw Error('v2の設定JSONではありません');S.names=obj.names||{};S.colors=obj.colors||{};S.mode=['relative','absolute'].includes(obj.mode)?obj.mode:'relative';S.profile=PROFILES[obj.profile]?obj.profile:'custom';S.weights=Array.isArray(obj.weights)&&obj.weights.length===5?obj.weights:S.weights;S.stale=+obj.stale||0;S.snapA=obj.snapA||S.snapA;S.snapB=obj.snapB||S.snapB;S.focus=obj.focus||S.focus;S.compareA=obj.compareA||S.compareA;S.compareB=obj.compareB||S.compareB;
 if(S.stocks.length){let available=new Set(S.stocks.map(x=>x.id));S.active=new Set((obj.evaluation||[]).filter(x=>available.has(x)));S.display=new Set((obj.display||[]).filter(x=>available.has(x)));if(obj.start&&obj.end){S.start=obj.start;S.end=obj.end;S.customDates=true}persist();invalidateAndCompute(true)}else{persist();render();alert('設定を読み込みました。対応する株価CSVを再度読み込んでください。')}}catch(e){alert('設定JSONの読み込み失敗：'+e.message)}}
// チャートを含む1画面をPNG画像に保存。画面の最初のグラフを対象とする。
function exportPlotPNG(){let c=$('#app canvas');if(!c){alert('出力するグラフがありません');return}c.toBlob(blob=>{if(!blob)return;let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='スコア分析_'+S.tab+'_'+(S.snapB||'')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),2500)},'image/png')}
// イベント委譲：画面を切り替えた後でも同じハンドラが使用できる。
document.addEventListener('click',async e=>{let btn=e.target.closest('button');if(!btn)return;if(btn.dataset.tab){S.tab=btn.dataset.tab;render();return}
 if(btn.dataset.stockrow){S.focus=btn.dataset.stockrow;S.highlight=S.focus;S.tab='decomp';render();return}
 if(btn.dataset.delete){let st=byId(btn.dataset.delete);if(!st||!confirm(sName(st)+' のCSVを削除しますか？'))return;S.stocks=S.stocks.filter(x=>x.id!==st.id);S.active.delete(st.id);S.display.delete(st.id);if(S.focus===st.id)S.focus=S.stocks[0]?.id||null;S.start='';S.end='';S.customDates=false;if(S.stocks.length){S.start=S.stocks.map(s=>s.start).sort()[0];S.end=S.stocks.map(s=>s.end).sort().at(-1)}invalidateAndCompute(true);return}
 switch(btn.id){case'addFiles':$('#inputFiles')?.click();break;case'sample':sampleStocks();break;
 case'recalculate':{let a=$('#fromDate').value,b=$('#toDate').value;if(!a||!b||a>b){alert('評価期間を確認してください');return}S.start=a;S.end=b;S.customDates=true;S.plotStart=null;S.plotEnd=null;S.mode=$('#scoreMode').value;S.stale=+$('#stale').value;persist();invalidateAndCompute(true);break}
 case'toggleSelector':{let d=$('#selector');if(d)d.hidden=!d.hidden;break}
 case'chooseAll':evalStocks().forEach(s=>S.display.add(s.id));render();$('#selector')?.removeAttribute('hidden');break;
 case'chooseNone':S.display.clear();render();$('#selector')?.removeAttribute('hidden');break;
 case'chooseFocus':S.display=new Set(S.focus?[S.focus]:[]);render();$('#selector')?.removeAttribute('hidden');break;
 case'chooseTop':S.display=new Set(snapshot(S.snapB).slice(0,10).map(x=>x.id));render();$('#selector')?.removeAttribute('hidden');break;
 case'applySnaps':updateSnapshots();break;
 case'applyPlot':{let a=$('#plotStart')?.value,b=$('#plotEnd')?.value;if(!a||!b||a>b){alert('表示範囲を確認してください');return}S.plotStart=nearestDate(a);S.plotEnd=nearestDate(b);render();break}
 case'resetPlot':S.plotStart=S.hist?.dates[0]||null;S.plotEnd=S.hist?.dates.at(-1)||null;render();break;
 case'exportPlotPNG':exportPlotPNG();break;case'exportDaily':exportDaily();break;
 case'applyWeights':{let a=K.map((_,i)=>clamp(+( $('#weight'+i)?.value||0),0,1000));if(sum(a)<=0){alert('重みを少なくとも1つ正にしてください');return}S.weights=a;S.profile='custom';persist();invalidateAndCompute(false);break}
 case'restoreWeights':S.weights=[...PROFILES.balanced];S.profile='balanced';persist();invalidateAndCompute(false);break;
 case'runWeights':{S.randomRuns=+($('#randomRuns')?.value||5000);let data=weightSimulation(snapshot(S.snapB),S.randomRuns);S.weightCache={stamp:`${S.snapB}|${S.revision}|${S.randomRuns}`,data};render();break}
 case'exportWeights':exportWeights();break;
 case'runForward':{S.forwardHorizon=+$('#forwardH').value;S.forwardTop=clamp(+$('#forwardTop').value||5,1,50);S.forwardFrom=+$('#forwardFrom').value;status('毎月末から未来の株価を検証しています',45);await yieldUI();let data=forwardEval(S.forwardHorizon,S.forwardTop,S.forwardFrom);S.forwardCache={stamp:`${S.revision}|${S.forwardHorizon}|${S.forwardTop}|${S.forwardFrom}`,data};clearStatus();render();break}
 case'exportForward':exportForward();break;
 case'activeAll':S.stocks.forEach(s=>S.active.add(s.id));invalidateAndCompute(true);break;
 case'activeNone':S.active.clear();resetAnalysis();render();break;
 case'clearStocks':if(confirm('すべての読み込み済み株価CSVを破棄しますか？')){S.stocks=[];S.active.clear();S.display.clear();S.focus=null;S.start='';S.end='';S.snapA=null;S.snapB=null;S.plotStart=null;S.plotEnd=null;resetAnalysis();render()}break;
 case'saveMeta':persist();alert('表示名・色・採点方式の設定をブラウザに保存しました');break;
 case'saveSettings':saveSettings();break;case'loadSettings':$('#settingsFile').click();break;
 }
});
document.addEventListener('change',async e=>{let t=e.target;
 if(t.id==='inputFiles'){let files=[...t.files];t.value='';await readFiles(files);return}
 if(t.id==='settingsFile'){if(t.files?.[0])await readSettings(t.files[0]);t.value='';return}
 if(t.dataset.color){S.colors[t.dataset.color]=t.value;persist();render();return}
 if(t.dataset.name){S.names[t.dataset.name]=t.value.trim()||getNameFromFile(byId(t.dataset.name)?.filename||'');persist();render();return}
 if(t.dataset.active){if(t.checked)S.active.add(t.dataset.active);else S.active.delete(t.dataset.active);invalidateAndCompute(true);return}
 if(t.dataset.display){if(t.checked)S.display.add(t.dataset.display);else S.display.delete(t.dataset.display);render();$('#selector')?.removeAttribute('hidden');return}
 switch(t.id){case'focusStock':S.focus=t.value;S.highlight=t.value;render();break;
 case'compareA':S.compareA=t.value;render();break;case'compareB':S.compareB=t.value;render();break;
 case'seriesType':S.seriesType=t.value;render();break;case'resolution':S.resolution=t.value;render();break;case'scoreSort':S.scoreSort=t.value;render();break;case'scoreDesc':S.scoreDesc=t.value==='1';render();break;case'topN':S.topN=+t.value;render();break;
 case'scoreMode':S.mode=t.value;persist();invalidateAndCompute(false);break;
 case'stale':S.stale=+t.value;persist();invalidateAndCompute(false);break;
 case'profile':{S.profile=t.value;S.weights=[...PROFILES[S.profile]];persist();invalidateAndCompute(false);break}
 }
});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='findName'){S.focusText=t.value;let box=$('#checkList');if(box)box.innerHTML=checkList()}});
document.addEventListener('click',e=>{let name=e.target.closest('[data-focus]');if(name){e.preventDefault();S.highlight=S.highlight===name.dataset.focus?null:name.dataset.focus;render()}});
// 行にネストされたbuttonのクリック委譲では拾えないため、行クリックを独立して処理。
document.addEventListener('click',e=>{let row=e.target.closest('[data-stockrow]');if(row&&!e.target.closest('button,input,select')){S.focus=row.dataset.stockrow;S.highlight=S.focus;S.tab='decomp';render()}});
const drop=()=>{document.addEventListener('dragover',e=>{let z=e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('drag')}});document.addEventListener('dragleave',e=>{let z=e.target.closest('#dropZone');if(z)z.classList.remove('drag')});document.addEventListener('drop',e=>{let z=e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.remove('drag');readFiles([...e.dataTransfer.files].filter(f=>/\.(csv|tsv|txt)$/i.test(f.name)))}})};
window.addEventListener('resize',()=>{clearTimeout(window.__scoreResize);window.__scoreResize=setTimeout(render,230)});
drop();render();
})();
</script>
